<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; width: 380px; margin: 0; color: #111827; }
    header { padding: 10px 12px; background: #111827; color: #fff; font-weight: 600; }
    nav { display: flex; border-bottom: 1px solid #e5e7eb; }
    nav button { flex: 1; border: 0; background: none; padding: 8px; cursor: pointer; font: inherit; }
    nav button.on { border-bottom: 2px solid #16a34a; font-weight: 600; }
    section { padding: 10px 12px; }
    section[hidden] { display: none; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    label:first-child { margin-top: 0; }
    .hint { color: #6b7280; font-weight: 400; font-size: 11px; }
    textarea { width: 100%; box-sizing: border-box; height: 70px; font: 12px ui-monospace, monospace; }
    input[type=number] { width: 60px; }
    .list { max-height: 360px; overflow-y: auto; }
    .item { padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
    .item a { color: #1d4ed8; text-decoration: none; font-weight: 500; }
    .item a:hover { text-decoration: underline; }
    .meta { color: #6b7280; font-size: 11px; margin-top: 2px; }
    .price { font-weight: 600; color: #111827; }
    .new { background: #dcfce7; color: #166534; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-right: 4px; }
    .actions { display: flex; gap: 6px; margin-top: 10px; }
    .actions button { flex: 1; padding: 6px; cursor: pointer; }
    .empty { color: #6b7280; padding: 20px 0; text-align: center; }
    .saved { color: #16a34a; font-size: 11px; min-height: 1em; }
  </style>
</head>
<body>
  <header>Marketplace Exact Match</header>
  <nav>
    <button data-tab="results" class="on">Matches</button>
    <button data-tab="settings">Settings</button>
  </nav>

  <section id="results">
    <div class="list"></div>
    <div class="actions">
      <button id="csv">Export CSV</button>
      <button id="clear">Clear list</button>
    </div>
  </section>

  <section id="settings" hidden>
    <label>Must match one of <span class="hint">— one per line; case, spaces, dashes ignored; <code>re:</code> for regex</span></label>
    <textarea id="match"></textarea>
    <label>Exclude if title contains <span class="hint">— whole words, one per line</span></label>
    <textarea id="exclude"></textarea>
    <label>Other listings</label>
    <select id="mode">
      <option value="dim">Dim</option>
      <option value="hide">Hide</option>
      <option value="off">Show normally</option>
    </select>
    <label><input type="checkbox" id="stopAtOutside" /> Ignore "results from outside your search"</label>
    <label>Max scrolls per scan <input type="number" id="maxScrolls" min="1" max="500" /></label>
    <div class="saved"></div>
  </section>

  <script src="match.js"></script>
  <script src="popup.js"></script>
</body>
</html>
